<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>测试平台 - 线框原型</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
    background:#f0f0f0; color:#333; font-size:13px;
    display:flex; flex-direction:column; height:100vh; overflow:hidden;
  }

  /* ===== 顶部导航 ===== */
  .topbar {
    height:52px; background:#2b2f36; color:#e8e8e8; flex:0 0 auto;
    display:flex; align-items:center; padding:0 16px; gap:16px;
  }
  .logo { font-size:16px; font-weight:bold; letter-spacing:1px; white-space:nowrap; }
  .logo .dot { color:#7ab8ff; }
  .global-search {
    flex:1; max-width:420px; height:30px; background:#3a3f47; border:1px solid #4a505a;
    border-radius:4px; display:flex; align-items:center; padding:0 10px; color:#9aa0aa;
  }
  .global-search .gs-icon { margin-right:8px; opacity:.7; }
  .top-right { margin-left:auto; display:flex; align-items:center; gap:14px; }
  .env-switch {
    height:28px; background:#3a3f47; border:1px solid #4a505a; border-radius:4px;
    display:flex; align-items:center; padding:0 10px; color:#c8cdd4; cursor:pointer;
  }
  .env-switch .env-dot { width:8px; height:8px; border-radius:50%; background:#4caf50; margin-right:6px; }
  .notify-icon { font-size:16px; cursor:pointer; opacity:.85; }
  .user { display:flex; align-items:center; gap:8px; cursor:pointer; }
  .avatar {
    width:30px; height:30px; border-radius:50%; background:#5b6b8c;
    display:flex; align-items:center; justify-content:center; font-size:12px; color:#fff;
  }

  /* ===== 主体布局 ===== */
  .main { flex:1; display:flex; overflow:hidden; }

  /* ===== 左侧菜单 ===== */
  .sidebar {
    width:224px; flex:0 0 auto; background:#fff; border-right:1px solid #ddd;
    overflow-y:auto; padding:8px 0;
  }
  .menu-item {
    padding:9px 16px; cursor:pointer; color:#444; white-space:nowrap;
    display:flex; align-items:center; justify-content:space-between;
    border-left:3px solid transparent; user-select:none;
  }
  .menu-item:hover { background:#f2f5f9; }
  .menu-item.active { background:#e8f0fb; color:#1a5fb4; border-left-color:#1a5fb4; font-weight:bold; }
  .menu-parent .mi-arrow { font-size:10px; color:#999; transition:transform .15s; }
  .menu-group.open .menu-parent .mi-arrow { transform:rotate(90deg); }
  .menu-children { display:none; }
  .menu-group.open .menu-children { display:block; }
  .menu-child { padding-left:34px; font-size:12.5px; }
  .menu-subgroup-title { padding:6px 16px 4px 22px; font-size:11px; color:#999; letter-spacing:.5px; }
  .menu-subgroup .menu-child { padding-left:42px; }
  .menu-sep { height:1px; background:#eee; margin:6px 12px; }

  /* ===== 内容区 ===== */
  .content { flex:1; overflow-y:auto; padding:16px 20px 40px; background:#f0f0f0; }
  .page-head { margin-bottom:14px; }
  .breadcrumb { font-size:12px; color:#888; margin-bottom:4px; }
  .page-title { font-size:19px; font-weight:bold; color:#222; }

  /* ===== 线框块 ===== */
  .wf {
    background:#fff; border:1px dashed #b5b5b5; border-radius:6px;
    padding:12px 14px; margin-bottom:14px;
  }
  .wf-title { font-size:13px; font-weight:bold; color:#555; margin-bottom:8px; }
  .wf-title .tag { font-weight:normal; color:#999; font-size:11px; margin-left:8px; }
  .wf-note {
    border:1px dashed #ccc; border-radius:4px; background:#fafafa;
    padding:10px 12px; color:#777; font-size:12px; min-height:34px;
  }
  .wf-note.small { min-height:24px; padding:6px 10px; }

  /* 按钮行 */
  .btns { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .btn {
    border:1px dashed #9aa; background:#f7f9fc; color:#556; border-radius:4px;
    padding:5px 14px; font-size:12px; cursor:pointer;
  }
  .btn.primary { border-style:solid; border-color:#1a5fb4; color:#1a5fb4; background:#eef4fc; }

  /* 统计卡片 */
  .cards { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:14px; }
  .card {
    background:#fff; border:1px dashed #b5b5b5; border-radius:6px;
    padding:16px; text-align:center;
  }
  .card-num { font-size:26px; font-weight:bold; color:#333; }
  .card-label { font-size:12px; color:#888; margin-top:6px; }

  /* 图表占位 */
  .chart-ph {
    height:150px; border:1px dashed #ccc; border-radius:4px; background:#fafafa;
    display:flex; align-items:center; justify-content:center; color:#aaa; font-size:12px;
  }
  .chart-ph.tall { height:110px; }

  /* 列表占位 */
  .list-row {
    border:1px dashed #e0e0e0; border-radius:4px; background:#fafafa;
    padding:8px 12px; margin-bottom:6px; color:#666; font-size:12px;
  }
  .list-row:last-child { margin-bottom:0; }

  /* 表格线框 */
  .tbl { border:1px dashed #ccc; border-radius:4px; overflow:hidden; }
  .tbl-head, .tbl-row { display:flex; }
  .tbl-head { background:#f2f2f2; font-weight:bold; color:#555; }
  .tbl-head span, .tbl-row span {
    flex:1; padding:7px 10px; border-right:1px dashed #e0e0e0; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap;
  }
  .tbl-head span:last-child, .tbl-row span:last-child { border-right:none; }
  .tbl-row { border-top:1px dashed #eee; color:#777; }
  .tbl-row span { color:#bbb; }

  /* 工具菜单 tab */
  .tool-tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
  .tool-tab {
    border:1px dashed #9aa; background:#f7f9fc; color:#556; border-radius:4px;
    padding:6px 14px; font-size:12px; cursor:pointer;
  }
  .tool-tab.active { border-style:solid; border-color:#1a5fb4; color:#1a5fb4; background:#eef4fc; font-weight:bold; }
  .tool-panel { display:none; }
  .tool-panel.active { display:block; }

  /* 页面切换 */
  .page { display:none; }
  .page.active { display:block; }

  /* 页脚 */
  .footer { text-align:center; color:#aaa; font-size:11px; padding:10px 0 4px; }
</style>
</head>
<body>

<!-- ===== 顶部导航 ===== -->
<div class="topbar">
  <div class="logo">测试平台<span class="dot">·</span>Wireframe</div>
  <div class="global-search"><span class="gs-icon">🔍</span>全局搜索：用例 / 报告 / 数据源 / 执行历史…</div>
  <div class="top-right">
    <div class="env-switch"><span class="env-dot"></span>环境：test ▾</div>
    <div class="notify-icon">🔔</div>
    <div class="user"><div class="avatar">测</div><span>测试员</span></div>
  </div>
</div>

<!-- ===== 主体 ===== -->
<div class="main">
  <!-- 左侧菜单 -->
  <div class="sidebar" id="menu"></div>

  <!-- 右侧内容区 -->
  <div class="content">
    <div class="page-head">
      <div class="breadcrumb" id="breadcrumb">工作台</div>
      <div class="page-title" id="page-title">工作台</div>
    </div>
    <div id="pages"></div>
    <div class="footer">线框原型 v1.0，基于需求文档 v1.5 生成</div>
  </div>
</div>

/* ================= 渲染 ================= */
function renderBlocks(blocks){
  return blocks.map(function(b){
    switch(b.t){
      case 'cards':
        return '<div class="cards">' + b.items.map(function(i){
          return '<div class="card"><div class="card-num">—</div><div class="card-label">' + i + '</div></div>';
        }).join('') + '</div>';
      case 'chart':
        return '<div class="wf"><div class="wf-title">' + b.title + '</div><div class="chart-ph">图表占位</div></div>';
      case 'list':
        return '<div class="wf"><div class="wf-title">' + b.title + '</div>' +
          b.items.map(function(i){ return '<div class="list-row">' + i + '</div>'; }).join('') + '</div>';
      case 'box':
        return '<div class="wf"><div class="wf-title">' + b.title + '</div><div class="wf-note">' + (b.note || '') + '</div></div>';
      case 'table':
        return '<div class="wf"><div class="wf-title">' + b.title + '</div><div class="tbl">' +
          '<div class="tbl-head">' + b.headers.map(function(h){ return '<span>' + h + '</span>'; }).join('') + '</div>' +
          Array.from({length:b.rows}, function(){ return '<div class="tbl-row">' + b.headers.map(function(){ return '<span>—</span>'; }).join('') + '</div>'; }).join('') +
          '</div></div>';
      case 'btns':
        return '<div class="btns">' + b.labels.map(function(l){ return '<span class="btn">' + l + '</span>'; }).join('') + '</div>';
    }
    return '';
  }).join('');
}

function renderMenuItem(c){
  if(c.group){
    return '<div class="menu-subgroup-title">' + c.group + '</div>' +
      '<div class="menu-subgroup">' + c.children.map(renderMenuItem).join('') + '</div>';
  }
  return '<div class="menu-item menu-child" data-id="' + c.id + '"' +
    (c.tab ? ' data-tab="' + c.tab + '"' : '') + '>' + c.label + '</div>';
}

function renderMenu(){
  var el = document.getElementById('menu');
  el.innerHTML = MENU.map(function(g){
    if(g.children){
      var first = g.children[0];
      var firstId = first.id || (first.children && first.children[0].id) || '';
      return '<div class="menu-group" data-group="' + g.id + '">' +
        '<div class="menu-item menu-parent" data-id="' + firstId + '">' +
          '<span>' + g.label + '</span><span class="mi-arrow">▸</span>' +
        '</div>' +
        '<div class="menu-children">' +
          g.children.map(renderMenuItem).join('') +
        '</div></div>';
    }
    return '<div class="menu-item" data-id="' + g.id + '">' + g.label + '</div>';
  }).join('');
}

function renderPages(){
  var container = document.getElementById('pages');
  var html = '';
  Object.keys(PAGES).forEach(function(id){
    var p = PAGES[id];
    if(p.tab) return; // 工具 tab 导航项不单独渲染
    if(p.tabs){ // 工具菜单：tab 容器
      html += '<section class="page" id="page-' + id + '">' +
        '<div class="tool-tabs">' + p.tabs.map(function(t){
          return '<span class="tool-tab" data-tab="' + t.id + '">' + t.label + '</span>';
        }).join('') + '</div>' +
        p.tabs.map(function(t){
          return '<div class="tool-panel" data-panel="' + t.id + '">' + renderBlocks(t.blocks) + '</div>';
        }).join('') + '</section>';
    } else {
      html += '<section class="page" id="page-' + id + '">' + renderBlocks(p.blocks) + '</section>';
    }
  });
  container.innerHTML = html;
}

/* ================= 交互 ================= */
function showPage(id){
  var meta = PAGES[id] || PAGES['dashboard'];
  document.querySelectorAll('.page').forEach(function(p){ p.classList.remove('active'); });

  if(meta.tab){
    // 工具菜单：显示 tools section 并激活对应 tab
    document.getElementById('page-tools').classList.add('active');
    document.querySelectorAll('.tool-tab').forEach(function(t){ t.classList.remove('active'); });
    document.querySelector('.tool-tab[data-tab="' + meta.tab + '"]').classList.add('active');
    document.querySelectorAll('.tool-panel').forEach(function(p){ p.classList.remove('active'); });
    document.querySelector('.tool-panel[data-panel="' + meta.tab + '"]').classList.add('active');
  } else {
    document.getElementById('page-' + id).classList.add('active');
  }

  document.getElementById('breadcrumb').textContent = meta.breadcrumb.join(' / ');
  document.getElementById('page-title').textContent = meta.title;

  document.querySelectorAll('.menu-item').forEach(function(m){ m.classList.remove('active'); });
  var item = document.querySelector('.menu-item[data-id="' + id + '"]');
  if(item){
    item.classList.add('active');
    var group = item.closest('.menu-group');
    if(group) group.classList.add('open');
  }
  document.querySelector('.content').scrollTop = 0;
}

/* 工具 tab 点击 */
document.addEventListener('click', function(e){
  var tab = e.target.closest('.tool-tab');
  if(tab){
    document.querySelectorAll('.tool-tab').forEach(function(t){ t.classList.remove('active'); });
    tab.classList.add('active');
    var id = tab.dataset.tab;
    document.querySelectorAll('.tool-panel').forEach(function(p){ p.classList.remove('active'); });
    document.querySelector('.tool-panel[data-panel="' + id + '"]').classList.add('active');
    return;
  }
  var item = e.target.closest('.menu-item');
  if(item){
    var group = item.closest('.menu-group');
    if(item.classList.contains('menu-parent') && group){
      group.classList.toggle('open');
    }
    showPage(item.dataset.id);
  }
});

/* ================= 初始化 ================= */
renderMenu();
renderPages();
showPage('dashboard');
</script>
