server:
  port: 8080

spring:
  application:
    name: test-platform-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/test_platform?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
    username: ${DB_USER:tp}
    password: ${DB_PASS:tp_dev_2026}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    # 下划线转驼峰映射
    map-underscore-to-camel-case: true
    # 控制台打印 SQL（开发期）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      # 全局逻辑删除字段
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置（密钥 ≥32 字符，生产必须用环境变量注入）
jwt:
  secret: ${JWT_SECRET:test-platform-dev-jwt-secret-key-2026-please-change}
  # access token 有效期（秒）：2 小时
  access-expire-seconds: 7200
  # refresh token 有效期（秒）：7 天
  refresh-expire-seconds: 604800

logging:
  level:
    com.testplatform: debug